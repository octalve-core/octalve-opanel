name: OPanel native engine acceptance
on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/opanel-native.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    env:
      DEBUG: 'true'
      OPANEL_REQUIRE_NATIVE_TOOLS: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install validation tools without starting system services
        run: |
          printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d >/dev/null
          sudo chmod 755 /usr/sbin/policy-rc.d
          sudo apt-get update
          sudo apt-get install -y nginx bind9-utils
      - run: python -m pip install -r backend/requirements.txt
      - run: python backend/manage.py test bridge --verbosity=2
