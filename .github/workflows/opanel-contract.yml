name: OPanel Console contract
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'scripts/**'
      - '.github/workflows/opanel-contract.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: octalve-core/octalve-console
          ref: a594d15b8e781506553f66e9d2a53301c94d6b7f
          path: .contract/console
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install independently pinned dependencies
        run: |
          python -m venv .contract/panel-env
          .contract/panel-env/bin/pip install -r backend/requirements.txt
          python -m venv .contract/console-env
          .contract/console-env/bin/pip install -r .contract/console/backend/requirements.txt
      - name: Verify actual issuer and panel contract with isolated databases
        run: |
          .contract/console-env/bin/python scripts/verify_console_contract.py --console-root .contract/console --panel-python "$PWD/.contract/panel-env/bin/python"
