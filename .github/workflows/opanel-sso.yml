name: OPanel SSO security
on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/opanel-sso.yml"
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  django:
    runs-on: ubuntu-latest
    env:
      DEBUG: "true"
      ALLOWED_HOSTS: "testserver,localhost,127.0.0.1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements.txt && python -m pip check
      - run: python -m compileall -q backend
      - working-directory: backend
        run: python manage.py check && python manage.py test bridge --verbosity=2
      - name: Enforce no untracked migrations
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run
